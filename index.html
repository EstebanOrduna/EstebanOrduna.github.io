<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esteban Orduña – QA Automation Engineer</title>
    <meta name="description" content="Portfolio de Esteban Orduña. QA Automation Engineer, SDET, Lean Six Sigma Black Belt.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <span class="nav-brand">EO</span>
            <div class="nav-links">
                <a href="#sobre-mi">Sobre mí</a>
                <a href="#trayectoria">Trayectoria</a>
                <a href="#servicios">Servicios</a>
                <a href="#contacto">Contacto</a>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <img id="imagen-perfil" src="assets/img/default.jpg" alt="Foto de perfil" class="profile-pic">
            <div class="hero-text">
                <h1 id="nombre">Cargando...</h1>
                <p id="titulo" class="hero-title"></p>
                <div class="hero-tags" id="hero-tags"></div>
                <div class="hero-cta">
                    <a href="#contacto" class="btn btn-primary">Contáctame</a>
                    <a id="linkedin-hero" href="#" class="btn btn-secondary" target="_blank" rel="noopener">
                        <i class="fab fa-linkedin"></i> LinkedIn
                    </a>
                </div>
            </div>
        </div>
    </section>

    <section id="sobre-mi" class="section">
        <div class="container">
            <h2 class="section-title">Sobre mí</h2>
            <p id="intro" class="section-text"></p>
        </div>
    </section>

    <section id="trayectoria" class="section section-alt">
        <div class="container">
            <h2 class="section-title">Trayectoria</h2>
            <div id="experiencia-lista" class="timeline"></div>
        </div>
    </section>

    <section id="servicios" class="section">
        <div class="container">
            <h2 class="section-title">Servicios</h2>
            <div id="servicios-grid" class="services-grid"></div>
        </div>
    </section>

    <section id="contacto" class="section section-alt">
        <div class="container">
            <h2 class="section-title">Contacto</h2>
            <p class="section-text">¿Tienes un proyecto o necesitas asesoría? Escríbeme.</p>
            <div class="contact-layout">
                <form id="contact-form" class="contact-form" novalidate>
                    <div class="form-group">
                        <label for="cf-name">Nombre</label>
                        <input type="text" id="cf-name" name="name" required placeholder="Tu nombre">
                    </div>
                    <div class="form-group">
                        <label for="cf-email">Correo</label>
                        <input type="email" id="cf-email" name="email" required placeholder="tu@correo.com">
                    </div>
                    <div class="form-group">
                        <label for="cf-message">Mensaje</label>
                        <textarea id="cf-message" name="message" required rows="4" placeholder="Cuéntame sobre tu proyecto..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-filled">
                        <i class="fas fa-paper-plane"></i> Enviar mensaje
                    </button>
                    <p id="form-status" class="form-status"></p>
                </form>
                <div class="contact-side">
                    <a id="linkedin-contact" href="#" class="contact-card" target="_blank" rel="noopener">
                        <i class="fab fa-linkedin"></i>
                        <span>Conectar en LinkedIn</span>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p id="footer-copy"></p>
        </div>
    </footer>

    <script src="profile.js"></script>
    <script src="loadProfile.js"></script>
</body>
</html>
